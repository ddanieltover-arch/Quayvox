<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quayvox — Global Logistics</title>
    <meta
      name="description"
      content="Global shipping with one control tower — track ocean, air, rail, and road from a single Quayvox timeline."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Quayvox" />
    <meta property="og:title" content="Quayvox — Global Logistics" />
    <meta
      property="og:description"
      content="Global shipping with one control tower — track ocean, air, rail, and road from a single timeline."
    />
    <meta property="og:url" content="https://www.quayvox.com/" />
    <meta property="og:image" content="https://www.quayvox.com/og-image.png" />
    <meta property="og:image:width" content="1536" />
    <meta property="og:image:height" content="1024" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Quayvox — Global Logistics" />
    <meta
      name="twitter:description"
      content="Global shipping with one control tower — track ocean, air, rail, and road from a single timeline."
    />
    <meta name="twitter:image" content="https://www.quayvox.com/og-image.png" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('quayvox-theme');
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(t === 'light' ? 'light' : 'dark');
          document.documentElement.style.colorScheme = t === 'light' ? 'light' : 'dark';
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
